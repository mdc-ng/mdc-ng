name: Build patched image (GHCR)

on:
  push:
    branches: [main]
    paths:
      - 'patched/**'
      - '.github/workflows/ghcr.yml'
  workflow_dispatch:
    inputs:
      version:
        description: 'Upstream mdcng/mdc tag (e.g. v1.36.0)'
        default: 'latest'

permissions:
  contents: read
  packages: write

env:
  VERSION: ${{ inputs.version || 'latest' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract and patch backend binaries
        run: |
          set -euo pipefail
          for arch in amd64 arm64; do
            docker pull -q --platform linux/$arch mdcng/mdc:$VERSION
            id=$(docker create --platform linux/$arch mdcng/mdc:$VERSION)
            mkdir -p patched/build/$arch
            docker cp $id:/usr/local/bin/mdc_ng_app patched/build/$arch/mdc_ng_app
            docker rm $id
            python3 -I patched/scripts/patch_providers.py patched/build/$arch/mdc_ng_app patched/providers/*.yaml
          done

      - name: Image tags
        id: meta
        run: |
          img=ghcr.io/${GITHUB_REPOSITORY,,}
          tags="$img:latest,$img:sha-${GITHUB_SHA::7}"
          [ "$VERSION" != latest ] && tags="$tags,$img:$VERSION"
          echo "tags=$tags" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: patched
          platforms: linux/amd64,linux/arm64
          build-args: BASE=mdcng/mdc:${{ env.VERSION }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
